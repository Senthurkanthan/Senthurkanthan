<svg width="1200" height="400" viewBox="0 0 1200 400"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Large glowing circles -->

  <circle cx="150" cy="120" r="100"
          fill="#2563eb"
          opacity="0.18"
          filter="url(#glow)">
    <animate attributeName="cx"
             values="150;1050;150"
             dur="14s"
             repeatCount="indefinite"/>
    <animate attributeName="cy"
             values="120;280;120"
             dur="10s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="1050" cy="280" r="110"
          fill="#9333ea"
          opacity="0.18"
          filter="url(#glow)">
    <animate attributeName="cx"
             values="1050;150;1050"
             dur="16s"
             repeatCount="indefinite"/>
    <animate attributeName="cy"
             values="280;100;280"
             dur="12s"
             repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="70" r="70"
          fill="#06b6d4"
          opacity="0.15"
          filter="url(#glow)">
    <animate attributeName="cx"
             values="600;900;300;600"
             dur="12s"
             repeatCount="indefinite"/>
  </circle>

  <!-- Small moving particles -->

  <g fill="#38bdf8">

    <circle cx="120" cy="80" r="3">
      <animate attributeName="cy"
               values="80;300;80"
               dur="7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="300" cy="300" r="2">
      <animate attributeName="cy"
               values="300;60;300"
               dur="8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="850" cy="70" r="3">
      <animate attributeName="cy"
               values="70;320;70"
               dur="9s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="130" r="2">
      <animate attributeName="cy"
               values="130;330;130"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Subtle grid -->

  <g stroke="#38bdf8"
     stroke-width="0.6"
     opacity="0.07">

    <path d="M0 80 H1200"/>
    <path d="M0 160 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M0 320 H1200"/>

    <path d="M100 0 V400"/>
    <path d="M200 0 V400"/>
    <path d="M300 0 V400"/>
    <path d="M400 0 V400"/>
    <path d="M500 0 V400"/>
    <path d="M600 0 V400"/>
    <path d="M700 0 V400"/>
    <path d="M800 0 V400"/>
    <path d="M900 0 V400"/>
    <path d="M1000 0 V400"/>
    <path d="M1100 0 V400"/>

  </g>

  <!-- Glow behind name -->

  <ellipse cx="600"
           cy="190"
           rx="400"
           ry="90"
           fill="#2563eb"
           opacity="0.10"
           filter="url(#glow)"/>

  <!-- NAME -->

  <text x="600"
        y="190"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#ffffff">

    👋 Hi, I'm Senthurkanthan

  </text>

  <!-- Subtitle -->

  <text x="600"
        y="235"
        text-anchor="middle"
        font-family="monospace"
        font-size="22"
        fill="#38bdf8">

    ⚡ DevOps Engineer

  </text>

  <!-- Bottom line -->

  <text x="600"
        y="275"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#94a3b8">

    Linux • AWS • Server Administration • Deployment

  </text>

  <!-- Border -->

  <rect x="2"
        y="2"
        width="1196"
        height="396"
        rx="15"
        fill="none"
        stroke="#38bdf8"
        stroke-opacity="0.2"/>

</svg>
